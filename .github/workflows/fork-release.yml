# Fork only: builds the "WoW Forever Custom" APK (app.wowforever.custom) from the custom branch, signs it with the
# fork's release key and publishes it as the latest GitHub release, where the custom build's in-app updater looks.
#
# Runs on every push to custom, after each upstream merge (called by fork-sync.yml) and by hand. Versions are the
# upstream versionName plus a fork build number: 2.4.6.1, 2.4.6.2, ... taken from the existing v<version>.N tags.
#
# Secrets (set by tools/fork-setup.sh): RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS,
# RELEASE_KEY_PASSWORD. Losing that key means reinstalling the app, since Android only updates with the same signature.
name: Fork release

on:
  push:
    branches: [custom]
    paths-ignore: ["**.md"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Pick the version
        id: version
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already released as $(git tag --points-at HEAD | head -1)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          last=$(git tag -l "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          build=$(( ${last:-0} + 1 ))
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*.*' 2>/dev/null || true)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=v$base.$build" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Install SDK components
        if: steps.version.outputs.skip != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Fetch bundled components
        if: steps.version.outputs.skip != 'true'
        run: tools/fetch_components.sh

      # Same trimming as upstream's release.yml.
      - name: Remove 32-bit Windows files from Proton
        if: steps.version.outputs.skip != 'true'
        run: |
          command -v zstd > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd > /dev/null; }
          python3 tools/trim_proton_i386.py app/src/main/assets/bundled_components/proton-11.0-90624-arm64ec.wcp

      - name: Build the browser-login helper
        if: steps.version.outputs.skip != 'true' && hashFiles('tools/wow-session-bridge/build.sh') != ''
        env:
          LLVM_MINGW: llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
          LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
        run: |
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          sh tools/wow-session-bridge/build.sh "$RUNNER_TEMP/$LLVM_MINGW/bin/aarch64-w64-mingw32-clang" \
            app/src/main/assets/wow-session-bridge.exe

      - name: Write local.properties
        if: steps.version.outputs.skip != 'true'
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up signing
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 is not set; run tools/fork-setup.sh"; exit 1; fi
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/release.jks
          {
            echo "storeFile=keystores/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystores/keystore.properties

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew --no-daemon :app:assembleModernCustom -PforkBuild=${{ steps.version.outputs.build }}

      - name: Verify the signature
        if: steps.version.outputs.skip != 'true'
        run: |
          apk=app/build/outputs/apk/modern/custom/app-modern-custom.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          cp "$apk" WoW-Forever-Custom.apk

      - name: Remove signing files
        if: always()
        run: rm -rf app/keystores/release.jks app/keystores/keystore.properties

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          range=${PREVIOUS:+$PREVIOUS..}HEAD
          notes=$(git log --no-merges --format='- %s' "$range" | head -50)
          gh release create "$TAG" WoW-Forever-Custom.apk \
            --target "$(git rev-parse HEAD)" \
            --title "WoW Forever ${TAG#v}" \
            --notes "${notes:-No changes listed.}" \
            --latest
